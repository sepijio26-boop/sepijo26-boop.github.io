// ============================================================
//  Auto Jump Reset — Forge 1.8.9 (MDK)
//  ساخت با:  Java 8  +  ./gradlew build
//  خروجی:    build/libs/AutoJumpReset-1.8.9-1.0.0.jar
// ============================================================

buildscript {
    repositories {
        mavenCentral()
        maven { url = "https://maven.minecraftforge.net/" }
    }
    dependencies {
        classpath "net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT"
    }
}

apply plugin: "net.minecraftforge.gradle.forge"

version = "1.0.0"
group = "com.autojumpreset"
archivesBaseName = "AutoJumpReset-1.8.9"

sourceCompatibility = targetCompatibility = "1.8"

minecraft {
    version = "1.8.9-11.15.1.2318-1.8.9"
    runDir = "run"
    mappings = "stable_22"
}

processResources {
    // جای‌گذاری خودکار نسخه‌ها داخل mcmod.info
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include "mcmod.info"
        expand "version": project.version, "mcversion": project.minecraft.version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude "mcmod.info"
    }
}
